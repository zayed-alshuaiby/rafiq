<style>:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#18231F; --muted:#56635E; --line:#D3DDD8;
  --pine:#123F3A; --pine-2:#1D5A52; --pine-soft:#DCEAE5; --brass:#9C7426;
  --em:#A3241C; --em-soft:#FBE9E7; --ur:#8A5300; --ur-soft:#FCF0DC;
  --p2:#1D5A52; --p3:#5B6F2A; --p4:#5F6B67;
  --radius-l:22px; --radius-s:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1816; --surface:#16231F; --ink:#E3ECE8; --muted:#9DB0A9; --line:#2A3D37;
    --pine:#8FD0C1; --pine-2:#6DB8A8; --pine-soft:#1C3631; --brass:#D9B36A;
    --em:#FF8A80; --em-soft:#3A1714; --ur:#F2B65C; --ur-soft:#38270C;
    --p2:#6DB8A8; --p3:#B8CC7A; --p4:#9DB0A9; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1816; --surface:#16231F; --ink:#E3ECE8; --muted:#9DB0A9; --line:#2A3D37;
  --pine:#8FD0C1; --pine-2:#6DB8A8; --pine-soft:#1C3631; --brass:#D9B36A;
  --em:#FF8A80; --em-soft:#3A1714; --ur:#F2B65C; --ur-soft:#38270C;
  --p2:#6DB8A8; --p3:#B8CC7A; --p4:#9DB0A9; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif; font-size:17px; line-height:1.75; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; }
.wrap{ max-width:680px; margin:0 auto; padding:0 20px; }
.pilot{ background:var(--pine); color:var(--bg); font-size:13px; padding:7px 20px; text-align:center; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pilot{ color:#0F1816; } }
.top{ display:flex; justify-content:space-between; align-items:center; padding:18px 0 6px; }
.logo{ font-weight:700; font-size:22px; color:var(--pine); text-decoration:none; letter-spacing:0; }
.logo small{ font-weight:400; color:var(--muted); font-size:13px; margin-inline-start:8px; }
#langBtn{ background:none; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:5px 14px; font:inherit; font-size:14px; cursor:pointer; }
main{ outline:none; padding:18px 0 40px; min-height:60vh; }
h1,h2,h3{ line-height:1.35; margin:0; }
.btn{ font:inherit; font-weight:600; border-radius:14px; padding:13px 24px; border:1.5px solid transparent; cursor:pointer; }
.btn.primary{ background:var(--pine); color:var(--surface); }
.btn.primary:disabled{ opacity:.35; cursor:not-allowed; }
.btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn.big{ width:100%; padding:17px; font-size:18px; }
.btn.small{ padding:5px 14px; font-size:13px; }
:focus-visible{ outline:3px solid var(--brass); outline-offset:3px; }

/* home */
.brand-big{ font-size:clamp(64px,18vw,112px); font-weight:700; color:var(--pine); line-height:1; margin:18px 0 6px; }
.tagline{ font-size:21px; font-weight:600; margin:0 0 10px; }
.lead{ color:var(--muted); margin:0 0 26px; max-width:34em; }
.facts{ list-style:none; padding:0; margin:0 0 28px; display:grid; gap:0; border-top:1px solid var(--line); }
.facts li{ display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.facts strong{ font-weight:600; } .facts span{ color:var(--muted); font-size:15px; }
.before{ background:var(--surface); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:22px; }
.before h2{ font-size:17px; margin-bottom:6px; } .before ul{ margin:0; padding-inline-start:20px; } .before li{ margin:4px 0; }
.consent{ display:flex; gap:12px; align-items:flex-start; margin:0 0 18px; cursor:pointer; font-size:16px; }
.consent input{ width:22px; height:22px; margin-top:4px; accent-color:var(--pine); flex:none; }

/* question */
.progress{ height:5px; background:var(--line); border-radius:9px; overflow:hidden; }
.progress div{ height:100%; background:var(--pine); transition:width .35s ease; }
.qmeta{ display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin:10px 0 26px; }
.qtext{ font-size:clamp(24px,5.4vw,31px); font-weight:600; margin-bottom:8px; }
.qalt{ color:var(--muted); font-size:14px; margin:0 0 6px; }
.added{ color:var(--brass); font-size:13px; margin:0 0 4px; }
.hint{ color:var(--muted); font-size:14px; margin:14px 0 10px; }
.opts{ display:grid; gap:10px; }
.opt{ display:flex; align-items:center; gap:14px; width:100%; text-align:start; font:inherit; background:var(--surface); color:var(--ink); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:15px 16px; cursor:pointer; }
.opt:hover{ border-color:var(--pine-2); }
.opt.ex{ background:transparent; }
.opt.on{ border-color:var(--pine); background:var(--pine-soft); }
.mark{ width:22px; height:22px; border:2px solid var(--muted); border-radius:50%; flex:none; position:relative; }
.opts[role=group] .mark{ border-radius:6px; }
.opt.on .mark{ border-color:var(--pine); background:var(--pine); }
.opt.on .mark::after{ content:""; position:absolute; inset:5px; background:var(--surface); border-radius:inherit; }
.opts[role=group] .opt.on .mark::after{ inset:auto; width:6px; height:11px; border:solid var(--surface); border-width:0 2.5px 2.5px 0; background:none; border-radius:0; left:6px; top:2px; transform:rotate(45deg); }
.nav{ display:flex; gap:10px; margin-top:24px; }
.nav .primary{ flex:1; }

/* stop screens */
.stop{ border-radius:var(--radius-l); padding:28px 24px; margin-top:8px; }
.stop h1{ font-size:clamp(26px,6vw,34px); margin-bottom:14px; }
.stop.em{ background:var(--em-soft); border:2px solid var(--em); } .stop.em h1{ color:var(--em); }
.stop.ur{ background:var(--ur-soft); border:2px solid var(--ur); } .stop.ur h1{ color:var(--ur); }
.stop.in{ background:var(--surface); }
.stopmsg{ font-size:18px; margin:0 0 12px; }
.call p{ margin:14px 0 8px; font-weight:600; }
.nums{ display:flex; gap:10px; flex-wrap:wrap; }
.num{ display:flex; flex-direction:column; text-decoration:none; color:inherit; background:var(--surface); border-radius:var(--radius-s); padding:10px 18px; min-width:130px; }
.num b{ font-size:28px; color:var(--em); line-height:1.2; } .num span{ font-size:14px; color:var(--muted); }
.stopnote{ color:var(--muted); font-size:15px; margin:18px 0; }

/* report */
.rhead{ border-bottom:2px solid var(--pine); padding-bottom:16px; margin-bottom:22px; }
.rbrand{ color:var(--pine); font-weight:700; margin:0; }
.rhead h1{ font-size:30px; margin-bottom:12px; }
.meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px 18px; margin:0; font-size:14px; }
.meta dt{ color:var(--muted); } .meta dd{ margin:0; font-weight:600; }
.ladder h2,.sh,.sum h2,.limits h2{ font-size:18px; margin:0 0 10px; }
.ladder ol{ list-style:none; margin:0 0 26px; padding:0; display:grid; gap:4px; }
.rung{ display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:4px 12px; padding:9px 14px; border-radius:var(--radius-s); color:var(--muted); background:transparent; border:1px dashed var(--line); }
.rung .pcode{ font-weight:700; font-size:14px; } .rung .pname{ font-weight:600; } .rung .pdesc{ grid-column:2; font-size:14px; }
.rung .you{ grid-row:1 / span 2; grid-column:3; font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--surface); }
.rung.here{ border:none; color:var(--surface); }
.rung.here.P0{ background:var(--em); } .rung.here.P1{ background:var(--ur); } .rung.here.P2{ background:var(--p2); } .rung.here.P3{ background:var(--p3); } .rung.here.P4{ background:var(--p4); }
.rung.here .you{ color:var(--ink); }
.sum{ background:var(--surface); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:26px; }
.sum p{ margin:0 0 12px; } .sum p:last-child{ margin:0; }
.sigs{ display:grid; gap:12px; margin-bottom:26px; }
.sig{ background:var(--surface); border-radius:var(--radius-s); padding:16px 18px; border-inline-start:5px solid var(--p4); }
.sig.P0{ border-color:var(--em); } .sig.P1{ border-color:var(--ur); } .sig.P2{ border-color:var(--p2); } .sig.P3{ border-color:var(--p3); }
.sig header{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:6px; }
.sig h3{ font-size:17px; }
.chip{ font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; color:var(--surface); background:var(--p4); }
.chip.P0{ background:var(--em); } .chip.P1{ background:var(--ur); } .chip.P2{ background:var(--p2); } .chip.P3{ background:var(--p3); }
.sig p{ margin:6px 0; } .trig,.path{ font-size:15px; } .trig span,.path span{ color:var(--muted); }
.path{ font-weight:600; } .rid{ font-size:12px; color:var(--muted); margin:0 !important; }
.fixed{ display:grid; gap:10px; margin:0 0 22px; padding:16px 0; border-block:1px solid var(--line); }
.fixed div{ display:grid; grid-template-columns:130px 1fr; gap:12px; } .fixed dt{ font-weight:600; } .fixed dd{ margin:0; color:var(--muted); }
.limits p{ color:var(--muted); font-size:15px; }
.ractions{ display:flex; gap:10px; flex-wrap:wrap; margin:22px 0; } .ractions .primary{ flex:1; }
.tech summary{ cursor:pointer; color:var(--muted); font-size:14px; margin-bottom:8px; }
.tech pre{ background:var(--surface); border-radius:var(--radius-s); padding:14px; font-size:12px; overflow-x:auto; line-height:1.5; }

/* docs */
.doc h1{ font-size:28px; margin:8px 0 8px; }
.tw{ overflow-x:auto; background:var(--surface); border-radius:var(--radius-s); }
table{ border-collapse:collapse; width:100%; font-size:14px; min-width:560px; }
th,td{ text-align:start; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ color:var(--muted); font-weight:600; }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; white-space:nowrap; font-size:13px; }
.prop{ color:var(--brass); font-weight:700; }
.small{ font-size:13px; color:var(--muted); margin-top:10px; }
.score{ font-size:18px; } .score b{ font-size:28px; color:var(--pine); }
.res{ font-weight:700; font-size:13px; } .res.ok{ color:var(--p2); } .res.bad{ color:var(--em); }

footer{ border-top:1px solid var(--line); padding:18px 0 28px; color:var(--muted); font-size:13px; }
footer nav{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:6px; }
footer a{ color:var(--pine); }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
@media print{
  .pilot,.top,footer,.noprint{ display:none !important; }
  body{ background:#fff; color:#000; font-size:12pt; }
  .sum,.sig,.before{ background:#fff; border:1px solid #ccc; }
  .rung.here{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sig{ break-inside:avoid; }
}
</style>

<script>// ================= Rafiq rules engine v1.0 (deterministic) =================
const RULE_VERSION = "1.0";

const PATHWAYS = {

// Messages: Arabic = doctor's approved-draft wording (source: Clinical Rules Catalogue v1.0).
// English = translation added for international reviewers (needs review).
const RULES = {
  "CR-001": { q: "Q01", cat: { ar: "الأهلية", en: "Eligibility" }, path: "NONE",
    ar: "تم تصميم رفيق حاليًا للبالغين بعمر 18 سنة فأكثر. لا يمكننا إكمال هذا التقييم من خلال النسخة الحالية.",
    en: "Rafiq is currently designed for adults aged 18 and over. We can’t complete this assessment in the current version." },
  "CR-002": { q: "Q02", cat: { ar: "علامة خطر طارئة", en: "Emergency red flag" }, path: "EMERGENCY",
    ar: "الألم المفاجئ والشديد في الخصية قد يكون علامة على حالة طبية طارئة، مثل التواء الخصية. توجّه إلى قسم الطوارئ فورًا. لا تنتظر إكمال التقييم داخل التطبيق.",
    en: "Sudden, severe testicular pain can be a sign of a medical emergency, such as testicular torsion. Go to the emergency department now. Don’t wait to finish the assessment." },
  "CR-003": { q: "Q03", cat: { ar: "علامة خطر طارئة", en: "Emergency red flag" }, path: "EMERGENCY",

  "CR-004": { q: "Q04", cat: { ar: "عرض يحتاج تقييمًا عاجلًا", en: "Urgent symptom" }, path: "URGENT_SAME_DAY",

  "CR-007": { q: "Q08", cat: { ar: "تاريخ بولي وتناسلي سابق", en: "Previous genitourinary history" }, path: "URO_ANDRO",

    category: RULES[id].cat.en, message_id: "MSG-" + id, care_pathway: extra.path || RULES[id].path, ...extra

  if (a.Q01 === "no") {
    add("CR-001", ["under_18"], "P4");
    return pack(signals, "ineligible");
  }
  if (a.Q02 === "yes") add("CR-002", ["sudden_severe_pain"], "P0");
  if (a.Q03 === "yes") add("CR-003", ["pain_with_nausea_vomiting_abdominal"], "P0");
  if (a.Q04 === "yes") add("CR-004", ["pain_swelling_with_fever"], "P1");
  if (a.Q05 === "yes") add("CR-005", ["new_lump_or_change"], "P2");

  const q07 = arr(a.Q07).filter(v => MAP.Q07[v]);
  if (q07.length) add("CR-006", q07, q07.some(v => MAP.Q07[v] === "P2") ? "P2" : "P3");

  const q08 = arr(a.Q08).filter(v => !["dont_know", "none"].includes(v));
  if (q08.length) add("CR-007", q08, "P2");

  const q09 = arr(a.Q09);
  const hormone = q09.filter(v => ["testosterone", "anabolic_steroids"].includes(v));
  if (hormone.length) add("CR-008", hormone, "P2");
  const gonado = q09.filter(v => ["chemotherapy", "radiotherapy"].includes(v));
  if (gonado.length) add("CR-009", gonado, "P2");
  if (q09.includes("long_term_meds")) add("CR-010", ["long_term_meds"], "P3");

  if (a.Q10 && a.Q10 !== "none") add("CR-011", [a.Q10], "P3");

  const q12 = arr(a.Q12).filter(v => !["none", "prefer_not"].includes(v));
  const q11 = arr(a.Q11).filter(v => !["none", "dont_know"].includes(v));
  if (q11.length) add("CR-012", q11, q12.length ? "P2" : "P3");

  if (q12.length) add("CR-013", q12, "P2", q12.includes("discharge") ? { path: "DISCHARGE" } : {});

  const q13 = arr(a.Q13).filter(v => MAP.Q13[v]);
  if (q13.length) add("CR-014", q13, q13.some(v => MAP.Q13[v] === "P2") ? "P2" : "P3");

  if (a.Q14 === "yes") {
    const d = a.Q14A || "unknown";
    const by = { lt6: ["P3", "FERT_EDU"], "6to12": ["P2", "FERT_ADVICE"], gt12: ["P2", "FERT_BOTH"], unknown: ["P2", "FERT_ADVICE"] }[d];
    add("CR-015", ["tried_to_conceive", "duration_" + d], by[0], { path: by[1] });
  }

  const q15 = arr(a.Q15).filter(v => !["none", "dont_remember"].includes(v));
  if (q15.length) {
    const abnormal = q15.includes("semen_analysis") && a.Q15A === "yes";
    add("CR-016", abnormal ? [...q15, "abnormal_semen_reported"] : q15, abnormal ? "P2" : "P3");
  }
  return pack(signals);
}

function pack(signals, forced) {
  signals.sort((x, y) => PR[x.priority] - PR[y.priority]);
  const highest = signals.length ? signals[0].priority : null;
  let status = forced || "completed";
  if (!forced && highest === "P0") status = "stopped_emergency";
  else if (!forced && highest === "P1") status = "stopped_urgent";
  return {
    status, urgent_flag: highest === "P0" || highest === "P1", highest_priority: highest,
    signals, diagnosis: null, fertility_score: null, clinical_rule_version: RULE_VERSION
  };
}

// ---------------- state & helpers ----------------
const S = { lang: "ar", view: "home", step: 0, a: {}, consent: false, id: "" };
const t = k => T[S.lang][k];
const L = o => o[S.lang];
const $ = sel => document.querySelector(sel);
const visibleQs = () => QUESTIONS.filter(q => !q.show || q.show(S.a));
const labelFor = v => {
  if (EXTRA_LABELS[v]) return L(EXTRA_LABELS[v]);
  for (const q of QUESTIONS) { const o = q.o.find(x => x.v === v); if (o) return L(o); }
  return v;
};
const listJoin = items => S.lang === "ar" ? items.join("، ") : items.join(", ");

function setLang(l) {
  S.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  render();
}
function go(view) { S.view = view; render(); window.scrollTo(0, 0); const m = $("#main"); if (m) m.focus({ preventScroll: true }); }
function newAssessment() { S.a = {}; S.step = 0; S.consent = false; history.replaceState(null, "", location.pathname + location.search); go("home"); }

// ---------------- views ----------------
function vHome() {
  return `<section class="home">
    <h1 class="brand-big">${S.lang === "ar" ? "رفيق" : "Rafiq"}</h1>
    <p class="tagline">${t("tagline")}</p>
    <p class="lead">${t("lead")}</p>
    <ul class="facts">${t("facts").map(([a, b]) => `<li><strong>${a}</strong><span>${b}</span></li>`).join("")}</ul>
    <div class="before"><h2>${t("notTitle")}</h2><ul>${t("nots").map(n => `<li>${n}</li>`).join("")}</ul></div>
    <label class="consent"><input type="checkbox" id="consent" ${S.consent ? "checked" : ""}><span>${t("consent")}</span></label>
    <button class="btn primary big" id="startBtn" ${S.consent ? "" : "disabled"}>${t("start")}</button>
  </section>`;
}

function vQuestion() {
  const qs = visibleQs(); const q = qs[S.step]; const cur = S.a[q.id];
  const pct = Math.round((S.step / qs.length) * 100);
  const other = S.lang === "ar" ? q.en : q.ar;
  const opts = q.o.map(o => {
    const sel = q.t === "multi" ? (cur || []).includes(o.v) : cur === o.v;
    return `<button type="button" class="opt ${sel ? "on" : ""} ${o.ex ? "ex" : ""}" data-v="${o.v}" role="${q.t === "multi" ? "checkbox" : "radio"}" aria-checked="${sel}">
      <span class="mark" aria-hidden="true"></span><span class="otext">${L(o)}</span></button>`;
  }).join("");
  const canNext = q.t === "multi" && (cur || []).length > 0;
  return `<section class="q">
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
    <div class="qmeta"><span>${L(SECTIONS[q.s])}</span><span>${S.step + 1} ${t("of")} ${qs.length}</span></div>
    <h1 class="qtext">${L(q)}</h1>
    <p class="qalt" lang="${S.lang === "ar" ? "en" : "ar"}" dir="${S.lang === "ar" ? "ltr" : "rtl"}">${other}</p>
    ${q.added ? `<p class="added">${t("added")}</p>` : ""}
    <p class="hint">${q.t === "multi" ? t("pickAll") : t("pickOne")}</p>
    <div class="opts" role="${q.t === "multi" ? "group" : "radiogroup"}">${opts}</div>
    <div class="nav">
      ${q.t === "multi" ? `<button class="btn primary" id="nextBtn" ${canNext ? "" : "disabled"}>${t("next")}</button>` : ""}
      <button class="btn ghost" id="backBtn">${t("back")}</button>
    </div>
  </section>`;
}

function vEmergency() {
  const r = evaluate(S.a); const p0 = r.signals.filter(s => s.priority === "P0");
  return `<section class="stop em" role="alert">
    <h1>${t("emTitle")}</h1>
    ${p0.map(s => `<p class="stopmsg">${L(RULES[s.rule_id])}</p>`).join("")}
    <div class="call"><p>${t("emCall")}</p><div class="nums">${t("emNums").map(([c, n]) => `<a href="tel:${n}" class="num"><span>${c}</span><b>${n}</b></a>`).join("")}</div></div>

}

function ladder(h) {
  return `<div class="ladder" aria-label="${t("ladder")}"><h2>${t("ladder")}</h2><ol>
    ${["P0", "P1", "P2", "P3", "P4"].map(p => `<li class="rung ${p} ${p === h ? "here" : ""}" ${p === h ? 'aria-current="true"' : ""}>
      <span class="pcode">${p}</span><span class="pname">${t("levels")[p][0]}</span><span class="pdesc">${t("levels")[p][1]}</span>
      ${p === h ? `<span class="you">${t("yourLevel")}</span>` : ""}</li>`).join("")}
  </ol></div>`;
}

function vReport() {
  const r = evaluate(S.a); const out = { assessment_id: S.id, ...r };
  const h = r.highest_priority || "P4";
  const date = new Date().toLocaleDateString(S.lang === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB", { year: "numeric", month: "long", day: "numeric" });
  const cats = [...new Set(r.signals.map(s => L(RULES[s.rule_id].cat)))];
  const cards = r.signals.map(s => `<article class="sig ${s.priority}">
      <header><span class="chip ${s.priority}">${s.priority} ${t("levels")[s.priority][0]}</span><h3>${L(RULES[s.rule_id].cat)}</h3></header>
      <p class="trig"><span>${t("basedOn")}:</span> ${listJoin(s.triggered_by.map(labelFor))}</p>

      <div><dt>${t("rVer")}</dt><dd>${r.clinical_rule_version}</dd></div><div><dt>${t("rId")}</dt><dd>${S.id}</dd></div></dl></header>
    ${ladder(r.signals.length ? h : "P4")}
    ${r.signals.length ? `<div class="sum"><p>${t("summaryA")}${listJoin(cats)}${t("summaryB")}</p>
       <h2>${t("nextStep")}</h2><p>${PR[h] <= 2 ? t("nextP2") : t("nextP3")}</p></div>
       <h2 class="sh">${t("signals")}</h2><div class="sigs">${cards}</div>`
      : `<div class="sum"><p>${t("noSignal")}</p></div>`}
    <dl class="fixed"><div><dt>${t("diag")}</dt><dd>${t("diagV")}</dd></div><div><dt>${t("score")}</dt><dd>${t("scoreV")}</dd></div></dl>
    <div class="limits"><h2>${t("limits")}</h2><p>${t("limitsV")}</p></div>
    <div class="ractions noprint"><button class="btn primary" id="printBtn">${t("print")}</button><button class="btn ghost" id="restartBtn">${t("restart")}</button></div>
    <details class="tech noprint"><summary>${t("tech")}</summary><button class="btn small" id="copyBtn">${t("copy")}</button><pre dir="ltr">${JSON.stringify(out, null, 2)}</pre></details>
  </section>`;
}

function vRules() {
  const rows = Object.entries(RULES).map(([id, r]) => `<tr><td class="mono">${id}</td><td class="mono">${r.q}</td><td>${L(r.cat)}${PROPOSED.includes(id) ? ` <span class="prop" title="${t("proposedNote")}">*</span>` : ""}</td><td>${L(PATHWAYS[r.path])}</td><td>${L(r)}</td></tr>`).join("");
  return `<section class="doc"><h1>${t("rulesTitle")}</h1><p class="lead">${t("rulesLead")}</p>
    <div class="tw"><table><thead><tr><th>ID</th><th>Q</th><th>${S.lang === "ar" ? "الفئة" : "Category"}</th><th>${t("pathway")}</th><th>${S.lang === "ar" ? "الرسالة للمستخدم" : "User message"}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small"><span class="prop">*</span> ${t("proposedNote")}</p></section>`;
}
function vTests() {
  let pass = 0;
  const rows = TESTS.map(([id, d, a, chk, exp]) => { let ok = false; try { ok = chk(evaluate(a)); } catch (e) { } if (ok) pass++;
    return `<tr><td class="mono">${id}</td><td dir="ltr">${d}</td><td dir="ltr">${exp}</td><td><span class="res ${ok ? "ok" : "bad"}">${ok ? t("passed") : t("failed")}</span></td></tr>`; }).join("");
  return `<section class="doc"><h1>${t("testsTitle")}</h1><p class="lead">${t("testsLead")}</p>
    <p class="score"><b>${pass}/${TESTS.length}</b> ${t("passed")}</p>
    <div class="tw"><table><thead><tr><th>ID</th><th>${S.lang === "ar" ? "الإجابات" : "Responses"}</th><th>${S.lang === "ar" ? "النتيجة المتوقعة" : "Expected"}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// ---------------- render & events ----------------
function render() {
  const route = location.hash.replace("#", "");
  const view = route === "rules" ? "rules" : route === "tests" ? "tests" : S.view;
  const V = { home: vHome, q: vQuestion, emergency: vEmergency, urgent: vUrgent, ineligible: vIneligible, report: vReport, rules: vRules, tests: vTests }[view] || vHome;
  $("#pilot").textContent = t("pilot");
  $("#langBtn").textContent = t("lang");
  $("#main").innerHTML = V();
  $("#main").className = "v-" + view;
  $("#foot").innerHTML = `<nav><a href="#">${t("footHome")}</a><a href="#rules">${t("footRules")}</a><a href="#tests">${t("footTests")}</a></nav><p>${t("footNote")}</p>`;
  bind(view);
}

function answer(q, v) {
  if (q.t === "multi") {
    const o = q.o.find(x => x.v === v); let cur = [...(S.a[q.id] || [])];
    if (cur.includes(v)) cur = cur.filter(x => x !== v);
    else if (o.ex) cur = [v];
    else cur = [...cur.filter(x => !q.o.find(y => y.v === x).ex), v];
    S.a[q.id] = cur; render(); return;
  }
  S.a[q.id] = v; advance(q);
}
function advance(q) {
  // clear answers of follow-ups that are no longer visible
  QUESTIONS.forEach(x => { if (x.show && !x.show(S.a)) delete S.a[x.id]; });
  if (q.s === 1) {
    const r = evaluate(S.a);
    if (r.status === "ineligible") return go("ineligible");
    if (r.status === "stopped_emergency") return go("emergency");
    if (r.status === "stopped_urgent") return go("urgent");
  }
  const qs = visibleQs();
  if (S.step < qs.length - 1) { S.step++; go("q"); }
  else { S.id = "RFQ-" + Math.random().toString(36).slice(2, 8).toUpperCase(); go("report"); }
}

function bind(view) {
  if (view === "home") {
    $("#consent").onchange = e => { S.consent = e.target.checked; $("#startBtn").disabled = !S.consent; };
    $("#startBtn").onclick = () => { S.step = 0; S.a = {}; go("q"); };
  }
  if (view === "q") {
    const q = visibleQs()[S.step];
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(q, b.dataset.v));
    const nb = $("#nextBtn"); if (nb) nb.onclick = () => advance(q);
    $("#backBtn").onclick = () => { if (S.step === 0) go("home"); else { S.step--; go("q"); } };
  }
  const rb = $("#restartBtn"); if (rb) rb.onclick = newAssessment;
  const pb = $("#printBtn"); if (pb) pb.onclick = () => { try { window.print(); } catch (e) { } };
  const cb = $("#copyBtn"); if (cb) cb.onclick = async () => { try { await navigator.clipboard.writeText($(".tech pre").textContent); cb.textContent = "✓"; } catch (e) { cb.textContent = "—"; } };
}

document.addEventListener("DOMContentLoaded", () => {
  $("#langBtn").onclick = () => setLang(S.lang === "ar" ? "en" : "ar");
  window.addEventListener("hashchange", () => { if (!location.hash) S.view = S.view; render(); window.scrollTo(0, 0); });
  render();
});
</script>
</body>
</html>
